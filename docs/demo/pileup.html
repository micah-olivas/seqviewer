<head><script>
(function () {
  try {
    var up = window.parent.document.documentElement.getAttribute("data-theme");
    var saved = localStorage.getItem("seqviewer-theme");
    var choice = up || (saved === "dark" || saved === "light" ? saved : "");
    var dark = choice ? choice === "dark" : window.matchMedia(
      "(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
  } catch (e) {}
})();

   the columns it describes.  The per-feature fills are emitted per page, from
   the colours the reference file carried, so they are not here. */

    display: block;
    margin-bottom: 5px;
}

    stroke-width: 1;

    display: block;
    margin-bottom: 4px;
}

    font: 600 11px SF Mono, Menlo, Consolas, monospace;
    letter-spacing: 0.04em;

   insert takes the boundary colour it shares with the dashed edges that mark
   it, the flanks a quieter grey. */

.sv-band-ins {
    fill: var(--cv-region);
    stroke-width: 1;

.sv-band-vec {
    stroke: var(--border);
}
.sv-band-ins {
    fill: var(--cv-region-focus);
    stroke: var(--cv-boundary);
}
.sv-band-tvec {

    opacity: 0.75;

.sv-band-tins {
    fill: var(--cv-boundary);

   position on a log scale between MISMATCH_TRACK_FLOOR and 1.0, so a
   sub-percent noise floor and a dominant variant are both legible in one row.
   Gridlines mark 1% and 10%; the upper one is the flag threshold, which the
   page used to state in a separate row of triangles.  Sits directly under the
   features track, sharing its columns, so a spike can be read against whatever
   it falls inside above it. */
.sv-mf {
    display: block;
    margin-bottom: 5px;
    /* Crosshair, not help: the readout is per position, and the cursor
       says pick one. A help cursor on this page means "there is a title
       here", which there is not -- the readout is drawn by script. */
    cursor: crosshair;
}
/* Below the flag threshold: every position carries some disagreement, so the
   floor is drawn as ground rather than as a finding. */
.sv-mf-fill {
    fill: var(--muted);
    opacity: 0.38;
}
/* At or above it. */
.sv-mf-hot {
    fill: var(--bad);
    opacity: 0.85;
}
.sv-mf-base {
    stroke: var(--border);
    stroke-width: 1;
}
.sv-mf-grid {
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 3 3;

/* The scale's numbers live outside the scrolling drawing and stay put, because
   a scale that scrolls away stops being one. Pinned to the left edge over a fade
   to the page ground, the same treatment the overflow arrows get: they have to
   stay legible over whatever bars scroll beneath them.

   One panel the full height of the track, rather than a box per label. The two
   marks sit about nine pixels apart and each box would be nine tall, so
   per-label backings would overlap and the lower one would paint over the
   upper's text. A single ground also hides the bars immediately below a number,
   which are what made it hard to read. */
.pileup-mf-marks {
    position: absolute;
    left: 0;
    width: 40px;
    pointer-events: none;
    z-index: 2;
    /* Opaque under the text, then a fixed 14px fade, so the runway does not
       shrink for a shorter label the way a percentage stop would. */
    background: linear-gradient(to right,
        var(--cv-bg) 0,
        var(--cv-bg) 26px,
        transparent 40px);
}
.pileup-mf-marks span {
    position: absolute;
    left: 2px;
    height: 9px;
    line-height: 9px;
    font: 8px var(--mono);
    color: var(--muted);
    white-space: nowrap;
}

  var tooltip = document.createElement('div');
  tooltip.style.cssText = 'position:fixed;background:#1e293b;color:#fff;padding:4px 8px;'
    + 'border-radius:4px;font-size:11px;pointer-events:none;display:none;z-index:10;'
    + 'font-family:SF Mono,Menlo,Consolas,monospace;';
  document.body.appendChild(tooltip);
  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var yp = e.clientY - rect.top;
    var col = Math.floor(x / cellW);
    if (col < 0 || col >= nCols) { tooltip.style.display = 'none'; return; }
    var rl = regionLabel(col);
    if (yp < refH) {
      tooltip.textContent = rl + 'Ref pos ' + (col + 1) + ': ' + refSeq[col];
    } else if (yp < consY + consH) {
      var ch = cons[col];
      var base = ch === '.' ? refSeq[col] : ch;
      var note = ch === '.' ? ' (match)' : ch === '-' ? '' : ' (mismatch)';
      tooltip.textContent = rl + 'Consensus pos ' + (col + 1) + ': ' + base + note;
    } else if (hasAA && yp >= aaY && yp < aaY + aaBlockH) {
      var insStart = flanks[0];
      // Derived from the drawn geometry, not from the nucleotide rate: reading
      // the residue index a different way than it was placed is what made the
      // tooltip name a third, differently wrong residue.
      var aaIdx = Math.floor((x - insStart * cellW) / aaCodonW);
      if (aaIdx >= 0 && aaIdx < refAA.length) {
        var band = Math.min(aaRows - 1,
                            Math.floor((yp - aaY) / (aaH + 2)));
        var names = ['Ref', 'Cons', 'Parent'];
        var seqs = [refAA, consAA, parentAA];
        var aa = seqs[band] ? seqs[band][aaIdx] : undefined;
        // Say the residue, then what the other rows read at the same codon, so
        // hovering any one row answers the comparison rather than half of it.
        var others = [];
        for (var bi = 0; bi < aaRows; bi++) {
          if (bi === band || !seqs[bi]) continue;
          others.push(names[bi] + ' ' + seqs[bi][aaIdx]);
        }
        tooltip.textContent = names[band] + ' AA ' + (aaIdx + 1) + ': ' + aa +
          (others.length ? '  (' + others.join(', ') + ')' : '');
      } else {
        tooltip.style.display = 'none'; return;
      }
    } else if (yp >= readsY && yp < readsY + nRows * cellH) {
      var row_idx = Math.floor((yp - readsY) / cellH);
      if (row_idx >= 0 && row_idx < nRows) {
        var ch = rows[row_idx][col];
        var label = ch === '.' ? refSeq[col] + ' (match)' : ch === '-' ? 'gap' : ch + ' (mismatch)';
        tooltip.textContent = rl + 'Read ' + (row_idx + 1) + ', pos ' + (col + 1) + ': ' + label;
      } else {
        tooltip.style.display = 'none'; return;
      }
    } else {
      tooltip.style.display = 'none'; return;
    }
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 24) + 'px';
  });
  canvas.addEventListener('mouseleave', function() {
    tooltip.style.display = 'none';
  });

  // --- Mismatch track readout ---
  /* The track shows how much a position disagrees; hovering says how much, in
   * reads rather than in pixels. A bar's height is a log-scaled fraction, which
   * is readable as "more" or "less" and not as a number, so the number has to be
   * available some other way.
   *
   * One handler over the whole track rather than an element per base. A
   * per-position rect with a title would be thousands of nodes on a plasmid, and
   * the track is already one path for exactly that reason.
   *
   * The counts arrive run-length encoded -- a mostly-clean reference is long runs
   * of the same pair -- and are expanded once here rather than searched per
   * mouse move.
   */
  if (mmRuns && mmRuns.length && scrollId) {
    var mmHost = document.getElementById(scrollId);
    var mmSvg = mmHost && mmHost.querySelector('svg.sv-mf');
    if (mmSvg) {
      var mmDis = new Array(nCols), mmCov = new Array(nCols), mmAt = 0;
      for (var mr = 0; mr < mmRuns.length; mr++) {
        for (var mk = 0; mk < mmRuns[mr][0] && mmAt < nCols; mk++) {
          mmDis[mmAt] = mmRuns[mr][1];
          mmCov[mmAt] = mmRuns[mr][2];
          mmAt++;
        }
      }
      mmSvg.addEventListener('mousemove', function(e) {
        var r = mmSvg.getBoundingClientRect();
        var col = Math.floor((e.clientX - r.left) / cellW);
        if (col < 0 || col >= nCols) { tooltip.style.display = 'none'; return; }
        var dis = mmDis[col], cov = mmCov[col];
        var text = regionLabel(col) + 'pos ' + (col + 1) + ': ';
        if (!cov) {
          text += 'no reads cover this position';
        } else {
          text += dis + ' of ' + cov + ' read' + (cov === 1 ? '' : 's') +
                  ' disagree' + (dis === 1 ? 's' : '') +
                  ' (' + (100 * dis / cov).toFixed(dis && dis / cov < 0.1 ? 2 : 1) + '%)';
        }
        tooltip.textContent = text;
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY - 24) + 'px';
      });
      mmSvg.addEventListener('mouseleave', function() {
        tooltip.style.display = 'none';
      });
    }
  }
}

/* Mirror horizontal scrolling across every pileup on the page.
 *
 * Each group scrolls in its own container, so without this a page of several
 * groups drifts out of register: the reader lines up a column in one pileup and
 * the group below it is showing somewhere else. Scrolling is what a reader does
 * to compare groups, so the groups have to move together.
 *
 * scrollLeft is mirrored as a raw pixel offset rather than as a fraction of the
 * scrollable width. Every group is drawn at the same pixels-per-base, so equal
 * offsets mean the same reference position even where the groups have different
 * reference lengths -- which is the register that matters. A fraction would put
 * them in different places on exactly those pages.
 *
 * Assigning scrollLeft here makes the browser fire scroll on the panes being
 * caught up, which re-enters this handler. Nothing guards against that beyond
 * the equality check, and nothing needs to: those panes are already at the
 * target offset, so the second pass assigns nothing and the echo stops. The
 * half-pixel tolerance is for fractional offsets at fractional zoom, where
 * assigning a value the pane cannot hold exactly would otherwise leave the two
 * nudging each other.
 */
function syncPileupScrolls() {
  var panes = [].slice.call(document.querySelectorAll('.pileup-scroll'));
  if (panes.length < 2) return;
  panes.forEach(function(pane) {
    pane.addEventListener('scroll', function() {
      var left = pane.scrollLeft;
      panes.forEach(function(other) {
        if (Math.abs(other.scrollLeft - left) > 0.5) other.scrollLeft = left;
      });
    });
  });
}

/* --- Copying the page ------------------------------------------------------
 *
 * Two things a reader wants to take away: the page itself, to keep or send, and
 * the plot as a picture, to paste somewhere that is not a browser.
 *
 * Both need a click to work at all. The clipboard refuses without user
 * activation, which is why this lives on a button and cannot be done on load.
 */

/* The page as it arrived, not as it now stands.
 *
 * drawPileup appends to the DOM as it runs -- the row labels, the overflow
 * arrows, the floating tooltip -- and serialising the live document would bake
 * those in. Re-opening such a file would then run the scripts again over a page
 * that already had them, drawing a second set of arrows. The row labels clear
 * themselves on each run; the rest are removed here.
 */
function pileupPageSource() {
  var clone = document.documentElement.cloneNode(true);
  [].forEach.call(clone.querySelectorAll('.pileup-mm-arrow'), function (n) {
    n.parentNode.removeChild(n);
  });
  [].forEach.call(clone.querySelectorAll('.pileup-labels'), function (n) {
    n.innerHTML = '';
  });
  [].forEach.call(clone.querySelectorAll('body > div'), function (n) {
    if (n.style && n.style.position === 'fixed') n.parentNode.removeChild(n);
  });
  /* The overlay and the transition state belong to this visit, not to the
     copy: serialising them mid-fade would save a page covered by its own
     background. */
  [].forEach.call(clone.querySelectorAll('.sv-fade'), function (n) {
    n.parentNode.removeChild(n);
  });
  clone.classList.remove('sv-leaving', 'sv-ready');
  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

/* One SVG track, rasterised.
 *
 * A serialised SVG is loaded as its own document, so the page's stylesheet does
 * not reach it and every class-based fill would come out black. The stylesheet
 * is copied into the SVG so the rules travel with it -- the custom properties
 * included, since the SVG root is that document's :root and the variables
 * resolve against it.
 */
function svgToImage(node, css) {
  var copy = node.cloneNode(true);
  copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  var style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.textContent = css;
  copy.insertBefore(style, copy.firstChild);
  var url = 'data:image/svg+xml;charset=utf-8,'
    + encodeURIComponent(new XMLSerializer().serializeToString(copy));
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error('could not rasterise a track')); };
    img.src = url;
  });
}

/* The plot as one image: every group's tracks and canvases, stacked as they are
 * drawn, at the full width of the reference rather than the scrolled window.
 */
function pileupImageBlob() {
  var panes = [].slice.call(document.querySelectorAll('.pileup-scroll'));
  if (!panes.length) return Promise.reject(new Error('nothing to copy'));

  var sheet = document.querySelector('style');
  var css = sheet ? sheet.textContent : '';
  var theme = document.documentElement.getAttribute('data-theme');
  // The clone has no ancestor carrying data-theme, so a dark page would
  // rasterise with the light values. Re-point the dark rules at :root.
  if (theme === 'dark') {
    css = css.replace(/\[data-theme="dark"\]/g, ':root');
  }

  var jobs = [];
  var rows = [];
  var total = 0, width = 0;
  panes.forEach(function (pane, pi) {
    if (pi) total += 12;                      // a gap between groups
    [].forEach.call(pane.children, function (node) {
      var tag = node.tagName.toLowerCase();
      var w = node.width && node.width.baseVal
        ? node.width.baseVal.value : node.width;
      var h = node.height && node.height.baseVal
        ? node.height.baseVal.value : node.height;
      if (tag === 'canvas') {
        // A canvas is sized in device pixels; its CSS box is the drawn size.
        w = parseFloat(node.style.width) || node.width;
        h = parseFloat(node.style.height) || node.height;
      }
      if (!w || !h) return;
      var margin = parseFloat(getComputedStyle(node).marginBottom) || 0;
      rows.push({node: node, tag: tag, y: total, w: w, h: h});
      total += h + margin;
      if (w > width) width = w;
    });
  });
  if (!rows.length) return Promise.reject(new Error('nothing to copy'));

  rows.forEach(function (row) {
    jobs.push(row.tag === 'canvas'
      ? Promise.resolve(row.node)
      : svgToImage(row.node, css));
  });

  return Promise.all(jobs).then(function (images) {
    var scale = window.devicePixelRatio || 1;
    var out = document.createElement('canvas');
    out.width = Math.ceil(width * scale);
    out.height = Math.ceil(total * scale);
    var ctx = out.getContext('2d');
    ctx.scale(scale, scale);
    // The page ground, so the image is not transparent where nothing is drawn.
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
    ctx.fillRect(0, 0, width, total);
    images.forEach(function (img, i) {
      ctx.drawImage(img, 0, rows[i].y, rows[i].w, rows[i].h);
    });
    return new Promise(function (resolve, reject) {
      out.toBlob(function (blob) {
        blob ? resolve(blob) : reject(new Error('could not encode the image'));
      }, 'image/png');
    });
  });
}

/* Where this page sits, and what to call a copy of it.
 *
 * A page opened from disk knows its own path, which is the one thing about
 * "the file" a browser can hand over as text.
 */
function pileupFilePath() {
  if (location.protocol !== 'file:') return '';
  return decodeURIComponent(location.pathname);
}

function pileupFileName() {
  var path = pileupFilePath();
  var base = path ? path.split('/').pop() : '';
  if (base) return base;
  var title = (document.title || 'pileup').replace(/[^A-Za-z0-9._-]+/g, '-');
  return title.replace(/^-+|-+$/g, '') + '.html';
}

function copyPileup(kind) {
  if (kind === 'image') {
    return pileupImageBlob().then(function (blob) {
      return navigator.clipboard.write([
        new ClipboardItem({'image/png': blob})
      ]);
    });
  }
  var path = pileupFilePath();
  if (!path) {
    return Promise.reject(new Error('this page has no path to copy'));
  }
  return navigator.clipboard.writeText(path);
}

/* Dragging the page out as a real file.
 *
 * The clipboard cannot carry a file: its safelist is text, HTML and PNG, and
 * the custom formats Chromium allows are namespaced so that native applications
 * ignore them. A drag can, through DownloadURL, which Chromium fulfils as a
 * macOS file promise -- so dragging this chip into Slack or Mail attaches the
 * page, where pasting never could.
 *
 * Two things to know about it. It is Chromium only; Safari does not implement
 * DownloadURL, and there the chip simply will not drag, which is why clicking
 * it copies the path instead. And a page opened from disk has an opaque origin,
 * so the blob URL below reads blob:null/... -- whether the browser will fulfil
 * a promise from one is its own business, and dragend reports what became of
 * the drop either way.
 */
function bindDragOut(chip) {
  var url = null;
  chip.addEventListener('dragstart', function (e) {
    if (url) URL.revokeObjectURL(url);
    var blob = new Blob([pileupPageSource()], {type: 'text/html'});
    url = URL.createObjectURL(blob);
    try {
      e.dataTransfer.setData('DownloadURL',
        'text/html:' + pileupFileName() + ':' + url);
      e.dataTransfer.effectAllowed = 'copy';
    } catch (err) {
      // Safari and anything else without DownloadURL: the drag carries the
      // path as text, which some targets will at least insert.
      e.dataTransfer.setData('text/plain', pileupFilePath());
    }
  });
  chip.addEventListener('dragend', function (e) {
    if (url) { URL.revokeObjectURL(url); url = null; }
    // dropEffect is 'none' when nothing accepted the drag, which is the only
    // signal available that the promise was not taken up.
    if (e.dataTransfer && e.dataTransfer.dropEffect === 'none') {
      say(chip, 'Not dropped');
    }
  });
}

/* Wire the buttons, and say what happened. A copy leaves no trace on the page,
 * so without a word back there is no way to tell it worked.
 */
/* Say something on the button itself and put it back after. A copy leaves no
 * trace on the page, so without a word back there is no way to tell it worked.
 */
function say(btn, message) {
  if (btn.dataset.saying) return;
  var was = btn.dataset.label || btn.textContent;
  btn.dataset.label = was;
  btn.dataset.saying = '1';
  btn.textContent = message;
  setTimeout(function () {
    btn.textContent = was;
    delete btn.dataset.saying;
  }, 1400);
}

function bindCopyButtons() {
  [].forEach.call(document.querySelectorAll('.sv-copy'), function (btn) {
    if (btn.classList.contains('sv-drag')) bindDragOut(btn);
    btn.addEventListener('click', function () {
      if (btn.dataset.saying) return;
      copyPileup(btn.dataset.copy).then(function () {
        say(btn, btn.dataset.copy === 'path' ? 'Path copied' : 'Copied');
      }, function (err) {
        say(btn, 'Copy failed');
        btn.title = String(err && err.message || err);
      });
    });
  });
}

/* The crossfade between this page and its summary.
 *
 * revealPage is called once the pileups are drawn, so the overlay lifts on a
 * page that is finished rather than on one that is about to fill in. The cap is
 * there because a page slow enough to miss it should be shown part-drawn rather
 * than held behind a blank screen.
 */
var REVEAL_CAP_MS = 700;

function revealPage() {
  document.documentElement.classList.add('sv-ready');
}

function bindViewToggle() {
  window.setTimeout(revealPage, REVEAL_CAP_MS);

  var link = document.querySelector('.sv-views-fixed a.sv-view');
  if (!link) { return; }
  var still = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  link.addEventListener('click', function (event) {
    if (event.button !== 0 || event.metaKey || event.ctrlKey
        || event.shiftKey || event.altKey) { return; }
    if (still) { return; }          /* navigate at once, with no fade */
    event.preventDefault();
    var href = link.getAttribute('href');
    document.documentElement.classList.add('sv-leaving');
    window.setTimeout(function () { window.location.href = href; }, 90);
  });
}
</script>
