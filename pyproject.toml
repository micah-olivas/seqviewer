[project]
name = "seqviewer"
version = "0.1.0"
description = "Lightweight viewers for sequencing constructs: read pileups against a reference, and summarized variant maps."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Micah Olivas", email = "mbolivas@stanford.edu" }]

# The core (model + renderer) is deliberately dependency-free: it turns a grid
# of (base, is_match) cells into a self-contained HTML page and nothing else.
dependencies = []

[project.optional-dependencies]
# Reading an existing SAM/BAM into a pileup grid.
sam = ["pysam>=0.20"]
# Aligning raw reads first. Also needs minimap2 and samtools on PATH.
align = ["pysam>=0.20"]
# Reading an annotated reference (GenBank, SnapGene).
annot = ["biopython>=1.80"]
# Everything the seqviewer-pileup command needs: it aligns reads and reads an
# annotated reference, so it is align plus annot under one name.
cli = ["pysam>=0.20", "biopython>=1.80"]
dev = ["pytest>=7", "biopython>=1.80", "numpy>=1.20"]
# Scanning read lengths with array operations rather than a line at a
# time. The figures reported are the same either way; the scan is faster.
fast = ["numpy>=1.20"]

[project.scripts]
# One command with subcommands, and each subcommand under its own name too.
seqview = "seqviewer.cli:seqview_main"
seqviewer-pileup = "seqviewer.cli:main"
seqviewer-lengths = "seqviewer.cli:lengths_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqviewer"]
